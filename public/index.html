<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Checkers</title>
<style>
body{font-family:system-ui,sans-serif;margin:1rem;display:flex;gap:2rem;flex-wrap:wrap}
#board{display:grid;grid-template-columns:repeat(8,56px);grid-template-rows:repeat(8,56px);border:3px solid #333}
.sq{display:flex;align-items:center;justify-content:center;background:#f0d9b5}.sq.d{background:#b58863}
.sq.last{outline:3px solid #ee0;outline-offset:-3px}
.pc{width:42px;height:42px;border-radius:50%;border:3px solid #0006;box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:gold;font-size:22px}
.pc.b{background:#222}.pc.r{background:#c22}
#moves{max-height:300px;overflow:auto;font-family:monospace;font-size:13px}
fieldset{margin-bottom:.8rem}input,select{margin:2px}
</style></head><body>
<div><div id="status">No game selected</div><div id="board" aria-label="board"></div></div>
<div>
<fieldset><legend>Game</legend><select id="picker"><option value="">-- pick a game --</option></select></fieldset>
<fieldset><legend>Speed</legend>
<input id="speed" type="range" min="0.1" max="20" step="0.1" value="1"> <span id="speedLabel">1.0x</span>
<button id="pause">Pause</button></fieldset>
<fieldset><legend>New game</legend>
<select id="color"><option value="">random color</option><option>black</option><option>red</option></select>
<input id="opp" placeholder="opponent URL (optional)"> <button id="new">New game</button></fieldset>
<fieldset><legend>Join</legend><input id="peer" placeholder="peer URL"><input id="gid" placeholder="game id"> <button id="join">Join</button></fieldset>
<div id="err" style="color:#c00"></div>
<div id="moves"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let es = null, cur = null;
const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json(); $('err').textContent = r.ok ? '' : j.error; return r.ok ? j : null;
};
function render(g) {
  cur = g;
  const last = new Set((g.lastMove?.path ?? []).map(([r, c]) => r * 8 + c));
  $('board').innerHTML = g.board.map((row, r) => row.map((p, c) =>
    `<div class="sq ${(r + c) % 2 ? 'd' : ''} ${last.has(r * 8 + c) ? 'last' : ''}">${p ? `<div class="pc ${p.toLowerCase()}">${p === p.toUpperCase() ? '♛' : ''}</div>` : ''}</div>`).join('')).join('');
  $('status').textContent = `You are ${g.myColor} · ${g.status}` + (g.status === 'active' ? ` · ${g.turn} to move` : '')
    + (g.winner ? ` · winner: ${g.winner}` : '') + (g.reason ? ` (${g.reason})` : '') + (g.paused ? ' · PAUSED' : '');
  $('speed').value = g.speed; $('speedLabel').textContent = g.speed.toFixed(1) + 'x';
  $('pause').textContent = g.paused ? 'Resume' : 'Pause';
  $('moves').innerHTML = g.history.map((m, i) => `${i + 1}. ${m.path.map(([r, c]) => 'abcdefgh'[c] + (8 - r)).join('→')}`).join('<br>');
}
function select(id) {
  if (es) es.close();
  if (!id) return;
  location.hash = id; $('picker').value = id;
  es = new EventSource(`/api/games/${encodeURIComponent(id)}/events`);
  es.addEventListener('state', (e) => render(JSON.parse(e.data)));
}
async function refresh() {
  const list = await api('/api/games'); if (!list) return;
  const sel = $('picker'), have = new Set([...sel.options].map((o) => o.value));
  for (const g of list) if (!have.has(g.id)) sel.add(new Option(`${g.id.slice(0, 8)} (${g.myColor})`, g.id));
  sel.value = cur?.id ?? '';
}
$('picker').onchange = (e) => select(e.target.value);
$('speed').oninput = (e) => { $('speedLabel').textContent = (+e.target.value).toFixed(1) + 'x'; };
$('speed').onchange = (e) => cur && api(`/api/games/${cur.id}/speed`, { speed: +e.target.value });
$('pause').onclick = () => cur && api(`/api/games/${cur.id}/pause`, { paused: !cur.paused });
$('new').onclick = async () => {
  const body = {}; if ($('color').value) body.color = $('color').value; if ($('opp').value) body.opponent = $('opp').value;
  const g = await api('/api/games', body); if (g) { await refresh(); select(g.id); }
};
$('join').onclick = async () => {
  const g = await api('/api/games/join', { peerUrl: $('peer').value, gameId: $('gid').value }); if (g) { await refresh(); select(g.id); }
};
refresh().then(() => location.hash.length > 1 && select(location.hash.slice(1)));
setInterval(refresh, 3000);
</script></body></html>
